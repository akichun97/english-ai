# Собирает APK для Android на GitHub, без аккаунта Expo.
# - На каждое изменение в main: APK появляется в разделе Releases репозитория.
# - На pull request: APK лежит во вкладке Actions → Artifacts.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код
        run: npx tsc --noEmit

      - name: Сгенерировать Android-проект
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_GIT_STATUS: 1

      # Без секрета APK подписывается стандартным ключом из шаблона Expo: он один и тот же
      # в каждой сборке, поэтому обновления ставятся поверх. Для Google Play нужен свой ключ
      # в секрете ANDROID_KEYSTORE_BASE64 (с паролем android и именем androiddebugkey).
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/debug.keystore
            echo "Используется постоянный ключ подписи"
          else
            echo "Используется стандартный ключ шаблона Expo"
          fi

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Переименовать APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "english-ai-$VERSION-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: english-ai-apk
          path: english-ai-*.apk

      - name: Опубликовать в Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: English AI ${{ env.VERSION }} (сборка ${{ github.run_number }})
          body: Скачайте файл .apk ниже и откройте его на телефоне Android.
          files: english-ai-*.apk
